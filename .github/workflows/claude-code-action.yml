name: Claude Code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-6
            --effort medium
            --dangerously-skip-permissions
          prompt: |
            Review the changes in pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Post your findings as inline PR review comments where possible.
            Write a comment summarizing the changes in the PR, regardless of whether you found any issues or not.